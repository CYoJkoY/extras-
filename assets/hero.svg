<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">extra- — Supplementary Scoop Bucket</title>
  <desc id="desc">A clean visual header for the extra- Scoop bucket, focused on maintainable package manifests.</desc>

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A9E8B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8A9E8B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="520" rx="34" fill="#1E1E1E"/>
  <rect x="34" y="34" width="1372" height="452" rx="28" fill="#2A2A2A" stroke="#5A6B6B" stroke-width="2"/>
  <rect x="36" y="36" width="1368" height="448" rx="26" fill="url(#fade)"/>

  <!-- Left: restrained package-flow visual -->
  <g transform="translate(94 104)">
    <rect x="0" y="0" width="430" height="312" rx="24" fill="#1E1E1E" stroke="#5A6B6B" stroke-width="2"/>

    <rect x="28" y="28" width="374" height="42" rx="12" fill="#343A37"/>
    <circle cx="52" cy="49" r="5" fill="#9E8F7E"/>
    <circle cx="71" cy="49" r="5" fill="#8A9E8B"/>
    <circle cx="90" cy="49" r="5" fill="#7A8E8E"/>
    <text x="112" y="55" fill="#BEB8AE" font-family="Segoe UI, Arial, sans-serif" font-size="14">scoop / manifest</text>

    <g transform="translate(30 96)">
      <rect width="160" height="72" rx="16" fill="#343A37"/>
      <rect x="18" y="17" width="38" height="38" rx="9" fill="#8A9E8B"/>
      <path d="M27 30h20v13H27z" fill="#1E1E1E"/>
      <path d="M31 34h12v5H31z" fill="#E6DED6"/>
      <text x="70" y="33" fill="#E6DED6" font-size="15" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Manifest</text>
      <text x="70" y="53" fill="#8A9E8B" font-size="12" font-family="Consolas, monospace">version · url</text>
    </g>

    <g transform="translate(240 96)">
      <rect width="160" height="72" rx="16" fill="#343A37"/>
      <rect x="18" y="17" width="38" height="38" rx="9" fill="#7A8E8E"/>
      <path d="M27 30h20v13H27z" fill="#1E1E1E"/>
      <path d="M31 34h12v5H31z" fill="#E6DED6"/>
      <text x="70" y="33" fill="#E6DED6" font-size="15" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Integrity</text>
      <text x="70" y="53" fill="#8A9E8B" font-size="12" font-family="Consolas, monospace">hash · verify</text>
    </g>

    <path d="M190 132 H240" stroke="#8A9E8B" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="215" cy="132" r="5" fill="#8A9E8B"/>

    <rect x="30" y="194" width="370" height="88" rx="16" fill="#343A37" stroke="#5A6B6B"/>
    <text x="50" y="227" fill="#E6DED6" font-family="Consolas, monospace" font-size="15">$ scoop install extras/&lt;package&gt;</text>
    <text x="50" y="253" fill="#8A9E8B" font-family="Consolas, monospace" font-size="12">download → verify → install → shim</text>
  </g>

  <!-- Right: single, protected typography zone -->
  <g transform="translate(610 104)">
    <text x="0" y="38" fill="#8A9E8B" font-family="Consolas, monospace" font-size="16" letter-spacing="3">SCOOP / WINDOWS SOFTWARE</text>

    <text x="0" y="112" fill="#E6DED6" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="300" letter-spacing="2">extra-</text>
    <text x="0" y="154" fill="#BEB8AE" font-family="Segoe UI, Arial, sans-serif" font-size="22">Supplementary manifests for Scoop</text>

    <rect x="0" y="190" width="610" height="2" fill="#5A6B6B"/>

    <g transform="translate(0 228)">
      <rect x="0" y="0" width="184" height="76" rx="18" fill="#343A37"/>
      <text x="20" y="30" fill="#8A9E8B" font-family="Consolas, monospace" font-size="12">01</text>
      <text x="20" y="55" fill="#E6DED6" font-family="Segoe UI, Arial, sans-serif" font-size="17">Manifests</text>
    </g>

    <g transform="translate(202 228)">
      <rect x="0" y="0" width="184" height="76" rx="18" fill="#343A37"/>
      <text x="20" y="30" fill="#8A9E8B" font-family="Consolas, monospace" font-size="12">02</text>
      <text x="20" y="55" fill="#E6DED6" font-family="Segoe UI, Arial, sans-serif" font-size="17">Verification</text>
    </g>

    <g transform="translate(404 228)">
      <rect x="0" y="0" width="184" height="76" rx="18" fill="#343A37"/>
      <text x="20" y="30" fill="#8A9E8B" font-family="Consolas, monospace" font-size="12">03</text>
      <text x="20" y="55" fill="#E6DED6" font-family="Segoe UI, Arial, sans-serif" font-size="17">Automation</text>
    </g>

    <text x="0" y="348" fill="#BEB8AE" font-family="Segoe UI, Arial, sans-serif" font-size="16">A focused community bucket built around practical Windows software.</text>
    <text x="0" y="378" fill="#7A8E8E" font-family="Consolas, monospace" font-size="12">bucket/ · bin/ · CI validation · MIT</text>
  </g>

  <!-- Decorative marks stay outside the typography zone -->
  <g opacity="0.75">
    <circle cx="1290" cy="84" r="7" fill="#8A9E8B"/>
    <circle cx="1320" cy="84" r="4" fill="#7A8E8E"/>
    <circle cx="1342" cy="84" r="2.5" fill="#9E8F7E"/>
  </g>
</svg>
