name: Update README tree

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bucket/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run tree update script
        shell: pwsh
        run: .\bin\update-readme-tree.ps1

      - name: Commit and push if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README project tree [skip ci]"
          git push
