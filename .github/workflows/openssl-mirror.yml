name: OpenSSL Windows Source Build

on:
  push:
    branches:
      - master
      - fix/19-openssl-mirror
    paths:
      - ".github/workflows/openssl-mirror.yml"
  schedule:
    - cron: "07 */4 * * *"
  workflow_dispatch:

concurrency:
  group: openssl-source-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve OpenSSL source versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      has_builds: ${{ steps.resolve.outputs.has_builds }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve versions
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          releases="$(gh api "repos/openssl/openssl/releases?per_page=100")"

          v4="$(jq -r '
            .[]
            | select(.draft == false and .prerelease == false)
            | .tag_name
            | select(test("^openssl-4\\.[0-9]+\\.[0-9]+$"))
            | sub("^openssl-"; "")
          ' <<<"$releases" | head -n 1)"

          v3="$(jq -r '
            .[]
            | select(.draft == false and .prerelease == false)
            | .tag_name
            | select(test("^openssl-3\\.[0-9]+\\.[0-9]+$"))
            | sub("^openssl-"; "")
          ' <<<"$releases" | head -n 1)"

          test -n "$v4"
          test -n "$v3"

          v1="1.1.1w"
          t1="OpenSSL_1_1_1w"
          t4="openssl-$v4"
          t3="openssl-$v3"

          existing='[]'
          if release_json="$(gh api "repos/$REPOSITORY/releases/tags/OpenSSL" 2>/dev/null)"; then
            existing="$(jq -c '[.assets[]?.name]' <<<"$release_json")"
          fi

          matrix="$(
            jq -cn \
              --arg v4 "$v4" \
              --arg t4 "$t4" \
              --arg v3 "$v3" \
              --arg t3 "$t3" \
              --arg v1 "$v1" \
              --arg t1 "$t1" \
              --argjson existing "$existing" '
              [
                {stream:"4", version:$v4, tag:$t4, arch:"x64",   target:"VC-WIN64A",    vcenv:"amd64",       asset:("openssl-" + $v4 + "-x64.zip")},
                {stream:"4", version:$v4, tag:$t4, arch:"x86",   target:"VC-WIN32",     vcenv:"amd64_x86",   asset:("openssl-" + $v4 + "-x86.zip")},
                {stream:"4", version:$v4, tag:$t4, arch:"arm64", target:"VC-WIN64-ARM", vcenv:"amd64_arm64", asset:("openssl-" + $v4 + "-arm64.zip")},
                {stream:"3", version:$v3, tag:$t3, arch:"x64",   target:"VC-WIN64A",    vcenv:"amd64",       asset:("openssl-" + $v3 + "-x64.zip")},
                {stream:"3", version:$v3, tag:$t3, arch:"x86",   target:"VC-WIN32",     vcenv:"amd64_x86",   asset:("openssl-" + $v3 + "-x86.zip")},
                {stream:"3", version:$v3, tag:$t3, arch:"arm64", target:"VC-WIN64-ARM", vcenv:"amd64_arm64", asset:("openssl-" + $v3 + "-arm64.zip")},
                {stream:"1", version:$v1, tag:$t1, arch:"x64",   target:"VC-WIN64A",    vcenv:"amd64",       asset:("openssl-" + $v1 + "-x64.zip")},
                {stream:"1", version:$v1, tag:$t1, arch:"x86",   target:"VC-WIN32",     vcenv:"amd64_x86",   asset:("openssl-" + $v1 + "-x86.zip")}
              ]
              | map(select(($existing | index(.asset)) == null))
              | {include:.}
            '
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$(jq '.include | length' <<<"$matrix")" -gt 0 ]]; then
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.stream }}.x ${{ matrix.arch }}
    needs: resolve
    if: ${{ needs.resolve.outputs.has_builds == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: windows-2022
    steps:
      - name: Checkout OpenSSL source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openssl/openssl
          ref: ${{ matrix.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install build tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          choco install strawberryperl nasm -y --no-progress
          $env:Path = "C:\Strawberry\perl\bin;C:\Program Files\NASM;$env:Path"
          perl -v
          nasm -v

      - name: Configure, build and package
        shell: powershell
        env:
          OPENSSL_TARGET: ${{ matrix.target }}
          VCENV: ${{ matrix.vcenv }}
          VERSION: ${{ matrix.version }}
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\Strawberry\perl\bin;C:\Program Files\NASM;$env:Path"

          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = Join-Path $env:ProgramFiles "Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsroot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsroot)) {
            throw "Visual Studio C++ toolset was not found."
          }

          $vcvarsall = Join-Path $vsroot "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            throw "vcvarsall.bat was not found: $vcvarsall"
          }

          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage"
          $zip = Join-Path $env:GITHUB_WORKSPACE $env:ASSET

          if (Test-Path $prefix) {
            Remove-Item $prefix -Recurse -Force
          }
          New-Item -ItemType Directory -Path $prefix | Out-Null

          $commands = @(
            ('call "' + $vcvarsall + '" ' + $env:VCENV),
            ('if errorlevel 1 exit /b %errorlevel%'),
            ('perl Configure ' + $env:OPENSSL_TARGET + ' no-makedepend enable-static-vcruntime --prefix="' + $prefix + '" --openssldir=ssl --libdir=lib'),
            ('if errorlevel 1 exit /b %errorlevel%'),
            'nmake /NOLOGO',
            'if errorlevel 1 exit /b %errorlevel%',
            'nmake /NOLOGO install_sw',
            'if errorlevel 1 exit /b %errorlevel%',
            'nmake /NOLOGO install_ssldirs',
            'if errorlevel 1 exit /b %errorlevel%'
          )

          cmd.exe /d /s /c ($commands -join " && ")
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL build failed with exit code $LASTEXITCODE."
          }

          $builtOpenSSL = Join-Path $prefix "bin\openssl.exe"
          if (-not (Test-Path $builtOpenSSL)) {
            throw "openssl.exe was not produced."
          }

          & $builtOpenSSL version -a
          if ($LASTEXITCODE -ne 0) {
            throw "Built openssl.exe could not be executed."
          }

          Get-ChildItem $prefix -Recurse -Filter *.pdb | Remove-Item -Force

          $sourceCommit = git rev-parse HEAD
          $buildInfo = @"
          OpenSSL source build
          Source: https://github.com/openssl/openssl
          Tag: $env:OPENSSL_TARGET
          Version: $env:VERSION
          Architecture: $env:ARCH
          Configure target: $env:OPENSSL_TARGET
          Visual Studio environment: $env:VCENV
          Configure flags: no-makedepend enable-static-vcruntime --openssldir=ssl --libdir=lib
          Source commit: $sourceCommit
          "@
          Set-Content -Path (Join-Path $prefix "BUILD-INFO.txt") -Value $buildInfo -Encoding UTF8
          Copy-Item LICENSE.txt (Join-Path $prefix "LICENSE.txt")

          Compress-Archive -Path (Join-Path $prefix "*") -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$env:ASSET$([char]9)$hash" | Out-File -FilePath (Join-Path $env:GITHUB_WORKSPACE "package.txt") -Encoding ascii

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ github.workspace }}/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish OpenSSL Release
    needs:
      - resolve
      - build
    if: ${{ always() && (needs.resolve.outputs.has_builds == 'false' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build packages
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/openssl-packages
          pattern: openssl-*.zip
          merge-multiple: true

      - name: Publish source-built assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGES: ${{ runner.temp }}/openssl-packages
        run: |
          set -euo pipefail

          release_tag="OpenSSL"
          notes="$RUNNER_TEMP/openssl-notes.md"

          if ! gh release view "$release_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            cat > "$notes" <<'EOF'
          # OpenSSL Windows source builds

          These archives are built from tagged releases of the official openssl/openssl source repository using Microsoft Visual C++ in GitHub Actions.

          They are source builds maintained by CYoJkoY/extras-; they are not OpenSSL Corporation-signed Windows installers.

          Each archive contains the OpenSSL runtime, headers, libraries, configuration files, and build provenance in BUILD-INFO.txt.
          EOF

            gh release create "$release_tag" \
              --repo "$REPOSITORY" \
              --target "$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')" \
              --title "OpenSSL Windows source builds" \
              --notes-file "$notes" \
              --draft \
              --latest=false
          fi

          if [[ -d "$PACKAGES" ]]; then
            find "$PACKAGES" -type f -name 'openssl-*.zip' -print0 \
              | xargs -0 -r gh release upload "$release_tag" --repo "$REPOSITORY"
          fi

          gh release edit "$release_tag" \
            --repo "$REPOSITORY" \
            --title "OpenSSL Windows source builds" \
            --draft=false \
            --latest=false

          mapfile -t legacy_releases < <(
            gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'
          )

          for legacy_tag in "\${legacy_releases[@]}"; do
            if [[ "$legacy_tag" =~ ^openssl(4|3|1)- ]]; then
              echo "Removing legacy release $legacy_tag"
              gh release delete "$legacy_tag" --repo "$REPOSITORY" --yes
            fi
          done
